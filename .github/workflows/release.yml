name: Build & Release Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Anugana.Rag/Anugana.Rag.csproj'

jobs:
  # ─── 1. Build Windows Standalone Executable (.exe) ─────────────────────────
  build-windows-exe:
    name: Build Windows Standalone EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Workloads
        run: dotnet workload restore ${{ env.PROJECT_PATH }} || true

      - name: Restore Dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} -p:TargetFrameworks=net10.0-desktop

      - name: Publish Windows Single-File EXE
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -f net10.0-desktop
          -c Release
          -r win-x64
          --self-contained true
          -p:TargetFrameworks=net10.0-desktop
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish/windows-exe

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anugana.Rag-Windows-Standalone.exe
          path: ./publish/windows-exe/Anugana.Rag.exe

  # ─── 2. Build Android APK (.apk) & App Bundle (.aab) ───────────────────────
  build-android:
    name: Build Android APK & AAB Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Workload
        run: |
          dotnet workload install android
          dotnet workload restore ${{ env.PROJECT_PATH }} || true

      - name: Decode Android Release Keystore (if secret provided)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Restore & Publish Android APK
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            dotnet publish ${{ env.PROJECT_PATH }} \
              -f net10.0-android \
              -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:AndroidPackageFormat=apk \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=${{ github.workspace }}/release.keystore \
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
              -o ./publish/android-apk
          else
            dotnet publish ${{ env.PROJECT_PATH }} \
              -f net10.0-android \
              -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:AndroidPackageFormat=apk \
              -o ./publish/android-apk
          fi

      - name: Restore & Publish Android AAB (Play Store Bundle)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            dotnet publish ${{ env.PROJECT_PATH }} \
              -f net10.0-android \
              -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:AndroidPackageFormat=aab \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=${{ github.workspace }}/release.keystore \
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
              -o ./publish/android-aab
          else
            dotnet publish ${{ env.PROJECT_PATH }} \
              -f net10.0-android \
              -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:AndroidPackageFormat=aab \
              -o ./publish/android-aab
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anugana.Rag-Android.apk
          path: ./publish/android-apk/*.apk

      - name: Upload Android AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anugana.Rag-Android.aab
          path: ./publish/android-aab/*.aab

  # ─── 4. Build WebAssembly Static Distribution & VPS Deployment ────────────
  build-webassembly:
    name: Build WebAssembly Web App & VPS Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WASM Workload
        run: |
          dotnet workload install wasm-tools
          dotnet workload restore ${{ env.PROJECT_PATH }} || true

      - name: Publish WASM Web Distribution
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -f net10.0-browserwasm
          -c Release
          -p:TargetFrameworks=net10.0-browserwasm
          -o ./publish/wasm

      - name: Ensure Read/Write Permissions on WASM Output
        run: sudo chmod -R 777 ./publish/wasm

      - name: List WASM Output Directory (Diagnostics)
        shell: bash
        run: |
          echo "=== WASM output directory ==="
          find ./publish/wasm -maxdepth 3 -type f | head -40 || true

      - name: Clean & prepare deploy target on VPS
        uses: appleboy/ssh-action@v1.0.3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/anugana.avnishkumar.co.in
            sudo rm -rf /var/www/anugana.avnishkumar.co.in/*
            sudo chown -R $USER:$USER /var/www/anugana.avnishkumar.co.in

      - name: Upload WASM files to VPS
        uses: appleboy/scp-action@v0.1.7
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "publish/wasm/wwwroot/**"
          target: "/var/www/anugana.avnishkumar.co.in"
          strip_components: 3

      - name: Set permissions on VPS
        uses: appleboy/ssh-action@v1.0.3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && always()
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/anugana.avnishkumar.co.in

      - name: Zip WASM Output
        shell: bash
        run: cd ./publish/wasm/wwwroot && zip -r ../../../Anugana.Rag-WebAssembly.zip .

      - name: Upload WASM Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anugana.Rag-WebAssembly.zip
          path: Anugana.Rag-WebAssembly.zip

  # ─── 5. Create GitHub Release & Attach All Binaries ───────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android, build-webassembly]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Prepare Release Package Files
        run: |
          mkdir -p ./final-release
          find ./release-artifacts -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -exec cp {} ./final-release/ \;
          ls -la ./final-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
